[package]
name = "StreamFlow-Tauri"
version = "1.0.0"
description = "StreamFlow - Twitch Stream Manager with Tauri Architecture"
authors = ["MaskiCoding"]
license = "MIT"
repository = "https://github.com/MaskiCoding/StreamFlow"
edition = "2021"
rust-version = "1.84.1"

[profile.release]
strip = "debuginfo"
lto = true

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
# Core Tauri dependencies (from Dorion)
tauri = { version = "2.3", features = ["devtools", "tray-icon", "image-png"] }
tauri-plugin-shell = "2.0"
tauri-plugin-process = "2.3.0"
tauri-plugin-http = "2.5"

# Serialization and JSON (common to both)
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"

# StreamFlow core dependencies
regex = "1.11"
dirs = "6.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }

# System integration
reqwest = { version = "0.12", features = ["blocking"] }
tokio = { version = "1", features = ["time"] }
sysinfo = "0.36"

# Utility crates
base64 = "0.22"
gumdrop = "0.8.1"
scraper = "0.21"

[target."cfg(windows)".dependencies]
winapi = { version = "0.3", features = ["winuser", "shellapi", "wincon"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.24"
objc = "0.2"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
