name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Frontend linting
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Frontend Formatting
        run: npx prettier --check "src/**/*.{js,css,html}"

  # Code quality checks
  code-quality:
    name: Code Quality
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Dependencies
        run: |
          rustup component add rustfmt
          rustup component add clippy

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy -- -D warnings

  # Build and test
  build:
    name: Build and Test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc, x86_64-pc-windows-gnu]
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install GNU target dependencies
        if: matrix.target == 'x86_64-pc-windows-gnu'
        shell: pwsh
        working-directory: .
        run: |
          # Install MinGW-w64 for GNU target
          choco install mingw --params "/Architecture:x86_64"

      - name: Build Debug
        run: cargo build --target ${{ matrix.target }} --verbose

      - name: Run Tests
        run: cargo test --target ${{ matrix.target }} --verbose

      - name: Build Release
        run: cargo build --release --target ${{ matrix.target }} --verbose

  # Create release builds
  release:
    name: Create Release Artifacts
    runs-on: windows-latest
    needs: [frontend-lint, code-quality, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release

      - name: Set Version Info
        id: version
        shell: pwsh
        env:
          FULL_SHA: ${{ github.sha }}
        run: |
          $BUILD_DATE = Get-Date -Format 'yyyyMMdd'
          $SHORT_SHA = $env:FULL_SHA.Substring(0, 7)
          $RELEASE_VERSION = "${BUILD_DATE}.${SHORT_SHA}"
          echo "BUILD_DATE=$BUILD_DATE" >> $env:GITHUB_ENV
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $env:GITHUB_ENV
          echo "release_version=$RELEASE_VERSION" >> $env:GITHUB_OUTPUT
          echo "Version: $RELEASE_VERSION"

      - name: Build Release
        working-directory: src-tauri
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Create Release Archive
        shell: pwsh
        run: |
          # Create release directory
          New-Item -ItemType Directory -Path "release" -Force
          
          # Copy the executable
          Copy-Item "src-tauri\target\x86_64-pc-windows-msvc\release\streamflow-tauri.exe" -Destination "release\"
          
          # Create archive
          Compress-Archive -Path "release\*" -DestinationPath "streamflow-tauri-windows-$env:RELEASE_VERSION.zip"

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: streamflow-tauri-windows-${{ steps.version.outputs.release_version }}
          path: streamflow-tauri-windows-*.zip
          retention-days: 30

  # Update rolling release
  rolling-release:
    name: Update Rolling Release
    runs-on: ubuntu-latest
    needs: release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.release.outputs.release_version }}
    steps:
      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        run: |
          # Find the latest artifact directory
          ARTIFACT_DIR=$(ls -d artifacts/*/ | head -1)
          
          # Find the zip file inside
          ZIP_FILE=$(find "$ARTIFACT_DIR" -name "*.zip" | head -1)
          
          # Move to root for upload
          mv "$ZIP_FILE" "streamflow-tauri-rolling-release.zip"
          
          # Generate checksums
          sha256sum "streamflow-tauri-rolling-release.zip" > "streamflow-tauri-rolling-release.zip.sha256"

      - name: Create/Update Rolling Release
        uses: softprops/action-gh-release@v2
        with:
          name: Rolling Release (${{ env.RELEASE_VERSION }})
          tag_name: rolling
          make_latest: true
          prerelease: false
          body: |
            🚀 **StreamFlow-Tauri Rolling Release**
            
            This is the latest rolling release of StreamFlow-Tauri, built automatically on every commit to main.
            
            **Version:** ${{ env.RELEASE_VERSION }}
            **Commit:** ${{ github.sha }}
            **Workflow:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            ## Installation
            1. Download the ZIP file
            2. Extract to your desired location
            3. Run `streamflow-tauri.exe`
            
            ## What's New
            - Improved Rust-native architecture following Dorion patterns
            - Enhanced error handling and configuration management
            - Better process management and cleanup
            - Modern modular codebase structure
            
          files: |
            streamflow-tauri-rolling-release.zip
            streamflow-tauri-rolling-release.zip.sha256
          generate_release_notes: false

  # Versioned release (triggered by v*.*.* tags)
  versioned-release:
    name: Create Versioned Release
    runs-on: windows-latest
    needs: [frontend-lint, code-quality, build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: versioned-release

      - name: Get Version from Tag
        id: tag
        shell: pwsh
        run: |
          $TAG = "${{ github.ref_name }}"
          $VERSION = $TAG -replace '^v', ''
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT
          echo "tag=$TAG" >> $env:GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build Release
        working-directory: src-tauri
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Create Release Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release" -Force
          Copy-Item "src-tauri\target\x86_64-pc-windows-msvc\release\streamflow-tauri.exe" -Destination "release\"
          Compress-Archive -Path "release\*" -DestinationPath "streamflow-tauri-windows-${{ steps.tag.outputs.version }}.zip"
          
          # Generate checksum
          $hash = Get-FileHash -Path "streamflow-tauri-windows-${{ steps.tag.outputs.version }}.zip" -Algorithm SHA256
          "$($hash.Algorithm): $($hash.Hash)" | Out-File -FilePath "streamflow-tauri-windows-${{ steps.tag.outputs.version }}.zip.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: StreamFlow ${{ steps.tag.outputs.tag }}
          tag_name: ${{ github.ref_name }}
          make_latest: true
          prerelease: false
          generate_release_notes: true
          files: |
            streamflow-tauri-windows-${{ steps.tag.outputs.version }}.zip
            streamflow-tauri-windows-${{ steps.tag.outputs.version }}.zip.sha256